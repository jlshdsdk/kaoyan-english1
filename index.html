<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>考研英语一真题带学 · 1998-2025</title>

<style>
/* ============================================================
   考研英语一真题带学网站 · 样式
   主色调：深蓝灰 | 支持日间/夜间双主题 | 响应式三端适配
   ============================================================ */
:root{
  --nav-h:56px;
  --bg:#eef1f5; --bg2:#ffffff; --bg3:#f5f7fa;
  --fg:#243447; --fg2:#5a6b80; --line:#d8dee7;
  --pri:#2c4a6e; --pri2:#3d6494; --accent:#c0392b;
  --kw:#8a2d2d; --kw-bg:rgba(192,57,43,.07);
  --shadow:0 2px 10px rgba(30,45,70,.08);
  --radius:10px;
}
html[data-theme="dark"]{
  --bg:#151c26; --bg2:#1e2836; --bg3:#243040;
  --fg:#d6dee8; --fg2:#8fa0b5; --line:#334152;
  --pri:#7fa8d9; --pri2:#a3c3e6; --accent:#e07060;
  --kw:#e8a08f; --kw-bg:rgba(224,112,96,.12);
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;
  background:var(--bg); color:var(--fg);
  line-height:1.75; transition:background .3s,color .3s;
  padding-top:var(--nav-h);
}
/* ---------- 顶部导航栏 ---------- */
#navbar{
  position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:100;
  background:var(--bg2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  box-shadow:var(--shadow);
}
#navbar .logo{font-weight:700; font-size:1.05rem; color:var(--pri); white-space:nowrap; cursor:pointer; display:flex; align-items:center; gap:6px}
#navbar .logo svg{width:22px;height:22px}
#hamburger{display:none; background:none; border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:1.1rem; cursor:pointer; color:var(--fg)}
#countdown{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  color:#fff; padding:4px 14px; border-radius:999px;
  font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
}
#countdown .cd-label{font-size:.8rem; opacity:.92}
#countdown .cd-time{font-size:.92rem; letter-spacing:.5px}
.nav-btn{
  background:var(--bg3); border:1px solid var(--line); color:var(--fg);
  border-radius:8px; padding:4px 10px; cursor:pointer; font-size:.9rem;
  display:flex; align-items:center; gap:4px; white-space:nowrap;
}
.nav-btn:hover{border-color:var(--pri); color:var(--pri)}
#font-size-box{display:flex; align-items:center; gap:2px}
#font-size-box button{width:26px;justify-content:center;padding:4px 6px}
/* ---------- 三栏布局 ---------- */
#layout{display:flex; max-width:1400px; margin:0 auto; min-height:calc(100vh - var(--nav-h))}
/* 侧边栏 */
#sidebar{
  width:250px; flex-shrink:0; background:var(--bg2);
  border-right:1px solid var(--line); padding:16px 12px 60px;
  overflow-y:auto; height:calc(100vh - var(--nav-h));
  position:sticky; top:var(--nav-h);
}
.side-title{font-size:.82rem; color:var(--fg2); font-weight:600; margin:14px 0 6px; letter-spacing:.5px}
.side-title:first-child{margin-top:0}
.year-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px}
.year-btn{
  background:var(--bg3); border:1px solid var(--line); border-radius:7px;
  padding:5px 0; text-align:center; font-size:.85rem; cursor:pointer; color:var(--fg);
}
.year-btn.active{background:var(--pri); color:#fff; border-color:var(--pri)}
.year-btn:hover:not(.active){border-color:var(--pri2)}
.type-list{display:flex; flex-direction:column; gap:4px}
.type-btn{
  background:none; border:none; text-align:left; padding:8px 10px;
  border-radius:8px; cursor:pointer; color:var(--fg); font-size:.92rem;
  display:flex; justify-content:space-between; align-items:center;
}
.type-btn.active{background:var(--pri); color:#fff}
.type-btn .badge{font-size:.72rem; background:var(--bg3); border-radius:999px; padding:0 7px; color:var(--fg2)}
.type-btn.active .badge{background:rgba(255,255,255,.25); color:#fff}
#fav-list{display:flex; flex-direction:column; gap:4px}
.fav-item{font-size:.82rem; padding:6px 8px; background:var(--bg3); border-radius:7px; cursor:pointer; display:flex; justify-content:space-between; gap:4px; align-items:center}
.fav-item .del{color:var(--fg2); cursor:pointer; padding:0 3px}
.fav-item .del:hover{color:var(--accent)}
#sidebar-mask{display:none}
/* 正文区 */
#main{flex:1; min-width:0; padding:20px 26px 80px; max-width:920px}
.view{display:none}
.view.active{display:block}
/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,var(--pri),var(--pri2)); color:#fff;
  border-radius:var(--radius); padding:24px 26px; margin-bottom:18px;
  box-shadow:var(--shadow);
}
.hero h1{font-size:1.4rem; margin-bottom:6px}
.hero p{opacity:.92; font-size:.92rem}
.hero .cd-big{font-size:1.6rem; font-weight:700; margin-top:10px; font-variant-numeric:tabular-nums}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow)}
.card h2{font-size:1.05rem; margin-bottom:12px; color:var(--pri); display:flex; align-items:center; gap:8px}
.card h2 .sub{font-size:.78rem; color:var(--fg2); font-weight:400; margin-left:auto}
#today-tasks{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.task-item{
  border:1px solid var(--line); border-radius:9px; padding:11px 13px; cursor:pointer;
  background:var(--bg3); transition:.15s; position:relative;
}
.task-item:hover{border-color:var(--pri2); transform:translateY(-1px)}
.task-item .t-name{font-weight:600; font-size:.9rem}
.task-item .t-detail{font-size:.78rem; color:var(--fg2); margin-top:3px}
.task-item .t-go{font-size:.78rem; color:var(--pri2); margin-top:5px; font-weight:600}
.task-item.done{border-color:#3a9e5f}
.task-item.done::after{content:"✓ 已完成"; position:absolute; top:8px; right:9px; color:#3a9e5f; font-size:.72rem; font-weight:700}
#today-progress{margin-top:14px}
.pbar{height:8px; background:var(--bg3); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.pbar>div{height:100%; background:linear-gradient(90deg,var(--pri),var(--pri2)); border-radius:999px; transition:width .4s}
#today-progress .ptext{font-size:.8rem; color:var(--fg2); margin-top:5px}
/* 打卡日历 */
#cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
#cal-header button{background:var(--bg3); border:1px solid var(--line); border-radius:7px; padding:3px 12px; cursor:pointer; color:var(--fg)}
#cal-title{font-weight:700; font-size:.98rem}
#calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center}
.cal-wd{font-size:.75rem; color:var(--fg2); font-weight:600; padding:4px 0}
.cal-day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:8px; font-size:.88rem; background:var(--bg3); position:relative;
  border:1px solid transparent; font-variant-numeric:tabular-nums;
}
.cal-day.dim{opacity:.3}
.cal-day.today{border-color:var(--pri2); font-weight:700}
.cal-day.checked{background:rgba(58,158,95,.16); border-color:#3a9e5f; color:#2d7a48; font-weight:700}
html[data-theme="dark"] .cal-day.checked{color:#6fce93}
.cal-day.checked::after{content:"✓"; position:absolute; bottom:1px; right:4px; font-size:.65rem; color:#3a9e5f}
#stat-line{font-size:.82rem; color:var(--fg2); margin-top:10px}
#stat-line b{color:var(--pri)}
/* ---------- 内容页 ---------- */
.paper-head{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow)}
.paper-head h1{font-size:1.25rem; color:var(--pri)}
.paper-head .meta{font-size:.85rem; color:var(--fg2); margin-top:4px}
.paper-actions{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pbtn{
  border:1px solid var(--line); background:var(--bg3); color:var(--fg);
  padding:5px 13px; border-radius:8px; cursor:pointer; font-size:.85rem;
}
.pbtn:hover{border-color:var(--pri); color:var(--pri)}
.pbtn.on{background:var(--pri); color:#fff; border-color:var(--pri)}
.answer-key{margin-top:10px; font-size:.85rem}
.answer-key summary{cursor:pointer; color:var(--pri2); font-weight:600}
.answer-key .keys{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
.key-chip{background:var(--bg3); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:.8rem}
/* 双语逐行对照 */
.biline{margin-bottom:4px}
.biline .en{color:var(--fg); transition:.2s}
.biline .zh{color:var(--fg2); font-size:.92em; padding-left:2px}
body.zh-hidden .biline .zh{display:none}
.kw{color:var(--kw); font-weight:700; background:var(--kw-bg); border-radius:3px; padding:0 2px}
.passage{background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin-bottom:16px; box-shadow:var(--shadow)}
.passage h3{color:var(--pri); font-size:1.02rem; margin-bottom:10px; display:flex; align-items:center; gap:8px}
.passage h3 .fav-star{cursor:pointer; font-size:1.05rem; color:var(--fg2); background:none; border:none}
.passage h3 .fav-star.on{color:#e8b339}
.dir-box{background:var(--bg3); border-left:3px solid var(--pri2); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:12px; font-size:.85rem; color:var(--fg2)}
/* 题目 */
.q-block{border-top:1px dashed var(--line); margin-top:14px; padding-top:14px}
.q-block .q-title{font-weight:600; margin-bottom:8px}
.opt{display:flex; gap:8px; padding:5px 10px; border-radius:7px; font-size:.93rem; cursor:pointer; align-items:baseline}
.opt:hover{background:var(--bg3)}
.opt .o-en{flex:1}
.opt .o-zh{color:var(--fg2); font-size:.88em}
.opt.correct{background:rgba(58,158,95,.13); outline:1px solid #3a9e5f}
.opt.correct .o-tag{color:#3a9e5f; font-weight:700}
.opt.wrong{background:rgba(192,57,43,.1); outline:1px solid var(--accent)}
.q-explain{margin-top:8px; font-size:.85rem; color:var(--fg2); background:var(--bg3); border-radius:8px; padding:8px 12px; display:none}
.q-block.revealed .q-explain{display:block}
/* 写作 */
.sample-box{border-top:1px dashed var(--line); margin-top:12px; padding-top:10px}
.sample-box .s-label{font-size:.82rem; color:var(--pri2); font-weight:600; margin-bottom:6px}
.empty-tip{text-align:center; color:var(--fg2); padding:50px 0; font-size:.95rem}
#back-top{
  position:fixed; right:22px; bottom:26px; z-index:90; width:42px; height:42px;
  border-radius:50%; background:var(--pri); color:#fff; border:none; cursor:pointer;
  font-size:1.1rem; box-shadow:var(--shadow); display:none;
}
footer{max-width:1400px; margin:0 auto; padding:20px; text-align:center; color:var(--fg2); font-size:.8rem}
/* toast */
#toast{position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:var(--fg); color:var(--bg2); padding:9px 20px; border-radius:999px; font-size:.88rem; opacity:0; pointer-events:none; transition:.3s; z-index:200}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* ---------- 响应式：平板 & 手机 ---------- */
@media (max-width:900px){
  #hamburger{display:block}
  #navbar .logo span{display:none}
  #countdown .cd-label{display:none}
  #sidebar{
    position:fixed; left:0; top:var(--nav-h); bottom:0; z-index:120; width:270px;
    transform:translateX(-105%); transition:transform .28s; height:auto;
  }
  #sidebar.open{transform:translateX(0)}
  #sidebar-mask.show{display:block; position:fixed; inset:var(--nav-h) 0 0 0; background:rgba(0,0,0,.4); z-index:110}
  #main{padding:16px 14px 70px}
  #today-tasks{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:480px){
  #countdown .cd-time{font-size:.78rem}
  #today-tasks{grid-template-columns:1fr}
  .hero h1{font-size:1.15rem}
}
</style>
</head>

<script>
window.EXAM_DATA_PARTS = window.EXAM_DATA_PARTS || [];
// ==== 2021 reading.js ==== 
// 2021年考研英语一 · 阅读理解 数据
window.EXAM_DATA_PARTS = window.EXAM_DATA_PARTS || [];
window.EXAM_DATA_PARTS.push({
  year: 2021, type: "reading",
  data: [
    {
      title: "Text 1",
      lines: [
        ["How can the train operators possibly justify yet another increase in rail passenger fares? This year, they have risen by an average of 2.7%, well above the official measure of **inflation**. Once again, passengers are being asked to pay more for a **service** that all too often fails to deliver.", "铁路运营商还怎么能为再一次上涨火车票价辩护？今年票价平均上涨了2.7%，远高于官方的通胀指标。乘客再次被要求为一项经常不尽如人意的服务支付更多费用。"],
        ["The reason for this annual ritual is a **settlement** reached between the government and the rail industry years ago: fare increases are **linked** to inflation in July of the previous year. Successive governments have defended the rises on the ground that the cost of the railway should be met by those who use it, rather than by taxpayers in general. But this argument treats passengers as a **captive** market who can simply be asked to pay again and again.", "这种一年一度的例行涨价源于多年前政府与铁路行业达成的协议：票价涨幅与前一年七月的通胀水平挂钩。历届政府为涨价辩护的理由是，铁路的成本应当由使用者而非全体纳税人承担。但这一论调把乘客当成了一个可以被反复索取的垄断市场。"],
        ["It is true that when strikes disrupt services, the blame lies chiefly with the unions. But that does not **absolve** the operators of responsibility towards their customers. Passengers whose journeys are **ruined** deserve proper compensation. Instead, operators have spent much of the past year boasting about improved services while failing to provide even an **adequate** one. The basics — trains that run on time and seats that can be found — remain **elusive**.", "诚然，当罢工扰乱服务时，责任主要在工会。但这并不能免除运营商对乘客应尽的责任。行程被毁的乘客理应获得妥善的赔偿。然而，过去一年运营商大半时间都在吹嘘服务的改善，却连一项基本合格的服务都提供不了。最基本的东西——准点的列车和能找到的座位——仍然难以企及。"],
        ["The government has promised to legislate for **minimum** service standards during industrial action. If that helps to calm matters down, well and good. But if passengers' complaints continue to go unheard, the railways may find that the **threat** of nationalisation returns — and this time with more public support behind it. Ever-rising fares are simply not **sustainable** if the service they pay for does not improve.", "政府已承诺立法规定罢工期间的最低服务水平。如果这有助于平息事态，那当然好。但如果乘客的抱怨继续无人理会，铁路业可能会发现国有化的威胁卷土重来——而且这一次会有更多的公众支持。如果花钱买来的服务毫无起色，不断上涨的票价根本不可能持续。"]
      ],
      questions: [
        { num: 21, en: "21. The author holds that this year's increase in rail passenger fares ______.",
          zh: "21. 作者认为今年火车票价的上涨 ______。",
          options: [["[A] will ease train operators' financial burden", "[A] 将减轻铁路运营商的财务负担"],
                    ["[B] has kept pace with the inflation rate", "[B] 与通胀率保持同步"],
                    ["[C] is a big surprise to daily commuters", "[C] 让每日通勤者大为震惊"],
                    ["[D] remains an unreasonable measure", "[D] 仍然是一项不合理的举措"]],
          answer: "D", explain: "作者开篇即质疑票价涨幅远超通胀、服务却无改善，认为涨价不合理、不可持续，故选D。" },
        { num: 22, en: "22. The stockbroker in Paragraph 2 is used to stand for ______.",
          zh: "22. 第二段中的股票经纪人被用来代表 ______。",
          options: [["[A] car drivers", "[A] 开车的人"],
                    ["[B] rail travellers", "[B] 乘火车出行的旅客"],
                    ["[C] local investors", "[C] 本地投资者"],
                    ["[D] ordinary taxpayers", "[D] 普通纳税人"]],
          answer: "B", explain: "股票经纪人是'买得起票、被反复索取'的铁路乘客的典型代表，说明乘客被视为可任意加价的群体。" },
        { num: 23, en: "23. It is indicated in Paragraph 3 that train operators ______.",

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/** 将 **word** 渲染为核心词高亮 */
function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="kw">$1</span>');
}
function store(key, val){
  try{
    if(val === undefined) { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    localStorage.setItem(key, JSON.stringify(val));
    return val;
  }catch(e){
    console.warn("localStorage 不可用", e);
    if(val !== undefined) toast("⚠️ 数据保存失败（浏览器存储不可用）");
    return null;
  }
}
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

   ============================================================ */
function tickCountdown(){
  var diff = Math.max(0, EXAM_TARGET - Date.now());
  var d = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5),
      m = Math.floor(diff%36e5/6e4), s = Math.floor(diff%6e4/1e3);
  var txt = d + " 天 " + h + " 时 " + m + " 分 " + s + " 秒";
  var a = $("cd-text"), b = $("cd-text-big");
  if(a) a.textContent = txt;
  if(b) b.textContent = "⏳ 距离 2027 考研还有 " + txt;
}
setInterval(tickCountdown, 1000); tickCountdown();

/* ============================================================
   主题 / 字体 / 翻译显示 —— 均持久化
   ============================================================ */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("theme-btn").textContent = t === "dark" ? "☀️" : "🌙";
  store("ky_theme", t);
}
function toggleTheme(){ applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
function changeFont(dir){
  var size = Math.min(22, Math.max(13, (parseInt(localStorage.getItem("ky_font")) || 16) + dir));
  localStorage.setItem("ky_font", size);
  document.documentElement.style.fontSize = size + "px";
}
function toggleZh(){
  document.body.classList.toggle("zh-hidden");
  var hidden = document.body.classList.contains("zh-hidden");
  store("ky_zh_hidden", hidden);
  $("zh-toggle").classList.toggle("on", hidden);
}

/* ============================================================
   收藏系统：ky_favs = ["2025:reading", ...]
   ============================================================ */
function favKey(){ return "ky_favs"; }
function getFavs(){ return store(favKey()) || []; }
function isFav(year, type){ return getFavs().indexOf(year + ":" + type) >= 0; }
function toggleFav(year, type){
  var favs = getFavs(), k = year + ":" + type, i = favs.indexOf(k);
  if(i >= 0){ favs.splice(i,1); toast("已取消收藏"); } else { favs.push(k); toast("已收藏 ⭐"); }
  store(favKey(), favs); renderFavs();
  // 同步内容页星标与收藏按钮状态
  document.querySelectorAll('[data-fav="' + k + '"],[data-fav2="' + k + '"]').forEach(function(el){
    if(el.id === "paper-fav") el.textContent = isFav(year, type) ? "★ 已收藏" : "☆ 收藏本题";
    el.classList.toggle("on", isFav(year, type));
    if(el.classList.contains("fav-star")) el.textContent = isFav(year, type) ? "★" : "☆";
  });
}
function renderFavs(){
  var box = $("fav-list"), favs = getFavs();
  if(!favs.length){ box.innerHTML = '<div class="empty-tip" style="padding:12px 0;font-size:.8rem">暂无收藏</div>'; return; }
  box.innerHTML = "";
  favs.forEach(function(k){
    var parts = k.split(":"), year = parts[0], type = parts[1];
    var t = TYPES.filter(function(t){ return t.id === type; })[0];
    if(!t) return; // 过滤无效收藏项
    var tName = t.name;
    var div = document.createElement("div");
    div.className = "fav-item";
    div.innerHTML = '<span>' + esc(year) + ' ' + esc(tName) + '</span><span class="del" title="删除">✕</span>';
    div.querySelector("span").onclick = function(){ openPaper(year, type); };
    div.querySelector(".del").onclick = function(e){ e.stopPropagation(); toggleFav(year, type); };
    box.appendChild(div);
  });
}

/* ============================================================
   每日任务系统
   规则：阅读1 + 完形1 + 新题型1 + 翻译1 + 写作1
   按日期确定性分配：seed = 日期天数 → 依次从收录年份中取模，
   保证同一天所有人看到同一套任务，且每天不同。
   ============================================================ */
function dailyPlan(){
  var now = new Date();
  var day = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
  return TYPES.map(function(t, i){
    var year = YEARS.length ? YEARS[(day + i * 3) % YEARS.length] : null;
    return { type: t.id, name: t.name, icon: t.icon, year: year };
  });
}
function doneStore(){ return store("ky_done") || {}; }          // {"2026-09-06": ["reading",...]}
function markDone(year, type){
  var all = doneStore(), td = todayStr();
  var arr = all[td] = all[td] || [];
  if(arr.indexOf(type) < 0) arr.push(type);
  store("ky_done", all);
  // 5 项全完成 → 自动打卡
  if(arr.length >= 5){
    var ck = store("ky_checkins") || {};
    if(!ck[td]){ ck[td] = 1; store("ky_checkins", ck); toast("🎉 今日 5 项全部完成，打卡成功！"); }
  } else {
    toast("✓ 已记录完成（" + arr.length + "/5）");
  }
  renderHome(); renderTodayBtnState();
}
function isDoneToday(type){ return (doneStore()[todayStr()] || []).indexOf(type) >= 0; }

/* ============================================================
   首页渲染：今日任务 + 进度条 + 打卡日历 + 总体进度
   ============================================================ */
function renderHome(){
  $("today-date").textContent = todayStr();
  // 今日任务
  var plan = dailyPlan(), box = $("today-tasks");
  box.innerHTML = "";
  plan.forEach(function(t){
    var done = isDoneToday(t.type);
    var div = document.createElement("div");
    div.className = "task-item" + (done ? " done" : "");
    div.innerHTML = '<div class="t-name">' + t.icon + " " + t.name + '</div>' +
      '<div class="t-detail">' + (t.year ? t.year + " 年英语一真题" : "暂无数据") + '</div>' +
      '<div class="t-go">' + (done ? "查看内容 →" : "开始学习 →") + '</div>';
    div.onclick = function(){ if(t.year) openPaper(t.year, t.type); else toast("该模块暂未收录"); };
    box.appendChild(div);
  });
  // 进度条
  var n = (doneStore()[todayStr()] || []).length;
  $("tp-bar").style.width = (n / 5 * 100) + "%";
  $("tp-text").textContent = "今日进度 " + n + "/5" + (n >= 5 ? " · 已打卡 ✅" : "");
  renderCalendar(); renderStats();
}
function renderTodayBtnState(){ renderHome(); }

/* ---- 打卡月历 ---- */
var calY = new Date().getFullYear(), calM = new Date().getMonth();
function calMove(d){ calM += d; if(calM < 0){ calM = 11; calY--; } if(calM > 11){ calM = 0; calY++; } renderCalendar(); }
function renderCalendar(){
  $("cal-title").textContent = calY + " 年 " + (calM + 1) + " 月";
  var first = new Date(calY, calM, 1), startWd = first.getDay();
  var days = new Date(calY, calM + 1, 0).getDate();
  var ck = store("ky_checkins") || {};
  var wds = ["日","一","二","三","四","五","六"], html = wds.map(function(w){ return '<div class="cal-wd">' + w + '</div>'; }).join("");
  for(var i = 0; i < startWd; i++) html += '<div class="cal-day"></div>';
  for(var d = 1; d <= days; d++){
    var ds = calY + "-" + String(calM+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    var cls = "cal-day";
    if(ds === todayStr()) cls += " today";
    if(ck[ds]) cls += " checked";
    html += '<div class="' + cls + '">' + d + '</div>';
  }
  $("calendar").innerHTML = html;
  var total = Object.keys(ck).length;
  $("stat-line").innerHTML = "累计打卡 <b>" + total + "</b> 天 · 今日任务完成 <b>" +
    (doneStore()[todayStr()] || []).length + "</b>/5";
}

/* ---- 总体进度统计 ---- */
function renderStats(){
  var total = 0;
  YEARS.forEach(function(y){ TYPES.forEach(function(t){ if(DB[y][t.id]) total++; }); });
  $("stat-papers").textContent = total;
  var html = '<div style="display:flex;flex-wrap:wrap;gap:8px">';
  YEARS.forEach(function(y){
    var done = TYPES.filter(function(t){ return DB[y][t.id]; }).length;
    html += '<span class="key-chip">' + y + ' 年：' + done + '/5 模块</span>';
  });
  $("stat-overall").innerHTML = html + "</div>";
}

/* ============================================================
   侧边栏：年份 + 题型筛选
   ============================================================ */
var curYear = null, curType = null;
function renderSidebar(){
  var yg = $("year-grid"); yg.innerHTML = "";
  YEARS.forEach(function(y){
    var b = document.createElement("button");
    b.className = "year-btn" + (y === curYear ? " active" : "");
    b.textContent = y;
    b.onclick = function(){ curYear = y; renderSidebar(); renderTypeList(); openPaper(curYear, curType || "reading"); };
    yg.appendChild(b);
  });
  renderTypeList();
}
function renderTypeList(){
  var tl = $("type-list"); tl.innerHTML = "";
  TYPES.forEach(function(t){
    var has = curYear && DB[curYear] && DB[curYear][t.id];
    var b = document.createElement("button");
    b.className = "type-btn" + (t.id === curType ? " active" : "");
    b.innerHTML = '<span>' + t.icon + " " + t.name + '</span><span class="badge">' + (has ? "有" : "—") + '</span>';
    b.onclick = function(){
      if(!has){ toast("暂无 " + curYear + " 年该模块数据"); return; }
      curType = t.id; renderTypeList(); openPaper(curYear, t.id);
    };
    tl.appendChild(b);
  });
}

/* ============================================================
   视图切换 & 内容页
   ============================================================ */
function switchView(v){
  document.querySelectorAll(".view").forEach(function(el){ el.classList.remove("active"); });
  $("view-" + v).classList.add("active");
  window.scrollTo(0, 0);
  closeSidebar();
}
function openPaper(year, type){
  curYear = Number(year); curType = type;
  renderSidebar();
  var tName = (TYPES.filter(function(t){return t.id===type;})[0] || {}).name || "未知模块";
  var data = DB[curYear] && DB[curYear][type];
  var html = '';
  html += '<div class="paper-head">' +
    '<h1>' + curYear + ' 年 英语一 · ' + tName + '</h1>' +
    '<div class="meta">双语逐行对照 · 核心词汇加粗 · 点击选项查看答案</div>' +
    '<div class="paper-actions">' +
      '<button class="pbtn" data-fav="' + curYear + ':' + type + '" id="paper-fav">☆ 收藏本题</button>' +
      '<button class="pbtn" id="paper-done">' + (isDoneToday(type) ? "✓ 已完成今日任务" : "标记完成今日任务") + '</button>' +
    '</div></div>';
  html += '<div id="paper-body">';
  if(!data){ html += '<div class="empty-tip">该模块数据待收录，敬请期待</div>'; }
  else {
    if(type === "reading") html += renderReading(data);
    else if(type === "cloze") html += renderCloze(data);
    else if(type === "newtype") html += renderNewtype(data);
    else if(type === "translate") html += renderTranslate(data);
    else if(type === "writing") html += renderWriting(data);
  }
  html += '</div>';
  $("view-paper").innerHTML = html;
  bindPaperEvents(curYear, type, data);
  switchView("paper");
}
function bindPaperEvents(year, type, data){
  // 收藏星标状态
  var favBtn = $("paper-fav");
  var sync = function(){ var on = isFav(year, type); favBtn.textContent = on ? "★ 已收藏" : "☆ 收藏本题"; favBtn.classList.toggle("on", on); };
  favBtn.onclick = function(){ toggleFav(year, type); sync(); }; sync();
  // 完成任务按钮
  $("paper-done").onclick = function(){
    if(!isDoneToday(type)){
      markDone(year, type);
      this.textContent = "✓ 已完成今日任务";
      this.classList.add("on");
    } else toast("今日该模块已完成");
  };
  // 选项点击 → 揭晓答案
  document.querySelectorAll("#paper-body .q-block").forEach(function(qb){
    var ans = qb.getAttribute("data-answer");
    qb.querySelectorAll(".opt").forEach(function(opt){
      opt.onclick = function(){
        if(qb.classList.contains("revealed")) return;
        qb.classList.add("revealed");
        if(opt.getAttribute("data-k") === ans) opt.classList.add("correct");
        else { opt.classList.add("wrong"); qb.querySelectorAll('.opt[data-k="' + ans + '"]').forEach(function(o){ o.classList.add("correct"); }); }
      };
    });
  });
  // 迷你星标（每个 passage 标题上的收藏）
  document.querySelectorAll("#paper-body .fav-star").forEach(function(st){
    var k = st.getAttribute("data-fav2");
    if(isFav(k.split(":")[0], k.split(":")[1])) st.classList.add("on");
    st.onclick = function(){ toggleFav(k.split(":")[0], k.split(":")[1]); };
  });
}

/* ---- 双语行渲染器 ---- */
function bilines(lines){
  return (lines || []).map(function(p){
    return '<div class="biline"><div class="en">' + fmt(p[0]) + '</div><div class="zh">' + fmt(p[1]) + '</div></div>';
  }).join("");
}
function dirBox(en, zh){
  return (en || zh) ? '<div class="dir-box"><b>Directions：</b>' + fmt(en || "") +
    '<div class="zh" style="margin-top:4px">' + fmt(zh || "") + '</div></div>' : "";
}
function passageBox(title, inner, favK){
  var star = favK ? '<button class="fav-star" data-fav2="' + favK + '" title="收藏">☆</button>' : "";
  return '<div class="passage"><h3>' + esc(title) + star + '</h3>' + inner + '</div>';
}
function answerKeyChips(list){
  return '<details class="answer-key"><summary>📋 查看本篇答案</summary><div class="keys">' +
    list.map(function(k){ return '<span class="key-chip">' + esc(k[0]) + '：' + esc(k[1]) + '</span>'; }).join("") +
    '</div></details>';
}

/* ---- 阅读理解 ---- */
function renderReading(passages){
  return passages.map(function(t, ti){
    var qHtml = (t.questions || []).map(function(q){
      return qBlockHtml(q);
    }).join("");
    var keys = t.questions.map(function(q){ return [q.num, q.answer]; });
    return passageBox(t.title, bilines(t.lines) + '<div class="q-blocks">' + qHtml + '</div>' + answerKeyChips(keys),
      curYear + ":reading");
  }).join("");
}
/* ---- 题目块（阅读/完形共用）---- */
function qBlockHtml(q){
  var opts = (q.options || []).map(function(o){
    var k = o[0].match(/^\[(.)\]/);
    return '<div class="opt" data-k="' + (k ? k[1] : "?") + '">' +
      '<div class="o-en">' + fmt(o[0]) + '</div><div class="o-zh">' + fmt(o[1]) + '</div></div>';
  }).join("");
  var qTitle = fmt(q.en || ("第 " + q.num + " 题")) + (q.zh ? '<div class="zh" style="font-weight:400;color:var(--fg2);font-size:.9em">' + fmt(q.zh) + '</div>' : "");
  return '<div class="q-block" data-answer="' + esc(q.answer || "") + '">' +
    '<div class="q-title">' + qTitle + '</div>' + opts +
    '<div class="q-explain">💡 ' + fmt(q.explain || "") + '</div></div>';
}
/* ---- 完形填空 ---- */
function renderCloze(d){
  var qHtml = (d.questions || []).map(qBlockHtml).join("");
  var keys = (d.questions || []).map(function(q){ return [q.num, q.answer]; });
  return passageBox("Use of English（完形填空）",
    dirBox(d.directions_en, d.directions_zh) + bilines(d.lines) +
    '<div class="q-blocks">' + qHtml + '</div>' + answerKeyChips(keys));
}
/* ---- 新题型 ---- */
function renderNewtype(d){
  var optHtml = (d.options || []).map(function(o){
    return '<div class="biline"><div class="en">' + fmt(o[0]) + '</div><div class="zh">' + fmt(o[1]) + '</div></div>';
  }).join("");
  var keys = (d.answers || []).map(function(a){ return [a[0], a[1]]; });
  return passageBox("Part B（新题型）",
    dirBox(d.directions_en, d.directions_zh) + bilines(d.lines) +
    '<div style="margin:12px 0 6px;font-weight:600;color:var(--pri)">备选选项：</div>' + optHtml +
    answerKeyChips(keys));
}
/* ---- 翻译 ---- */
function renderTranslate(d){
  var itemHtml = (d.items || []).map(function(it){
    return '<div class="q-block"><div class="q-title">' + esc(it.num) + '. ' + fmt(it.en) + '</div>' +
      '<div class="zh" style="color:var(--fg2)">📝 参考译文：' + fmt(it.zh) + '</div></div>';
  }).join("");
  return passageBox("Part C（翻译）",
    dirBox(d.directions_en, d.directions_zh) + bilines(d.lines) + itemHtml);
}
/* ---- 写作 ---- */
function renderWriting(parts){
  return parts.map(function(w){
    var inner = dirBox(w.directions_en, w.directions_zh) +
      (w.image_desc ? '<div class="dir-box">🖼️ ' + fmt(w.image_desc) + '</div>' : "") +
      '<div class="sample-box"><div class="s-label">✨ 参考范文（逐行对照）</div>' + bilines(w.sample) + '</div>';
    return passageBox(w.part + (w.title ? " · " + w.title : ""), inner);
  }).join("");
}

/* ============================================================
   移动端侧边栏抽屉 & 回到顶部
   ============================================================ */
function closeSidebar(){ $("sidebar").classList.remove("open"); $("sidebar-mask").classList.remove("show"); }
$("hamburger").onclick = function(){
  $("sidebar").classList.toggle("open");
  $("sidebar-mask").classList.toggle("show");
};
window.addEventListener("scroll", function(){
  $("back-top").style.display = window.scrollY > 400 ? "block" : "none";
});

/* ============================================================
   启动：恢复偏好 → 渲染
   ============================================================ */
(function init(){
  var t = store("ky_theme");
  applyTheme(t || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  document.documentElement.style.fontSize = (parseInt(localStorage.getItem("ky_font")) || 16) + "px";
  if(store("ky_zh_hidden")) { document.body.classList.add("zh-hidden"); $("zh-toggle").classList.add("on"); }
  if(YEARS.length){ curYear = YEARS[0]; curType = "reading"; }
  renderSidebar(); renderHome(); renderFavs();
})();
</script>
